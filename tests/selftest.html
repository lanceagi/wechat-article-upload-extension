<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公众号 HTML 导入器 · 自测</title>
<style>
  body{margin:0;padding:32px;background:#f5f6f7;color:#1f2328;
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  h1{font-size:20px;margin:0 0 6px}
  .sub{color:#6b7280;font-size:13px;margin-bottom:18px}
  #summary{background:#fff;border:1px solid #e6e8eb;border-radius:10px;padding:12px 14px;font-weight:700}
  #results{margin-top:14px;display:grid;gap:6px}
  .row{background:#fff;border:1px solid #e6e8eb;border-radius:9px;padding:9px 12px;font-size:13px}
  .row.ok{border-left:3px solid #07c160}
  .row.fail{border-left:3px solid #ef4444;background:#fff7f7}
  .tag{display:inline-block;font-weight:700;font-size:11px;border-radius:4px;padding:1px 6px;margin-right:8px}
  .ok .tag{background:#e9fbf1;color:#047857}
  .fail .tag{background:#fee2e2;color:#b91c1c}
  .detail{color:#b91c1c;font-size:12px;margin-top:4px}
</style>
</head>
<body>
<h1>公众号 HTML 导入器 · 自测</h1>
<div class="sub">在真实浏览器里跑 inliner.js：基准稿保真、压力稿降级、图片管线、CSS 变量与 rem。</div>
<pre id="summary">等待运行…</pre>
<div id="results"></div>
<script src="../extension/core.js"></script>
<script src="../extension/inliner.js"></script>
<script src="selftest.js"></script>
</body>
</html>
